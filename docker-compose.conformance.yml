services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spatialvault
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  spatialvault:
    build: .
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPATIALVAULT__DATABASE__URL: postgresql://postgres:postgres@postgis:5432/spatialvault
      SPATIALVAULT__AUTH__DISABLED: "true"
      SPATIALVAULT__BASE_URL: http://localhost:8080
      RUST_LOG: spatialvault=info

  ogc-cite:
    image: ogccite/ets-ogcapi-features10
    ports:
      - "8081:8080"
    profiles:
      - cite
